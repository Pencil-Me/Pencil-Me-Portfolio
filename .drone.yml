kind: pipeline
type: docker
name: default

steps:
  - name: frontend-quality
    image: node:20
    commands:
      - cd applications/frontend
      - npm ci
      - npm run quality:ci

  - name: frontend-e2e
    image: mcr.microsoft.com/playwright:v1.50.0-noble
    commands:
      - cd applications/frontend
      - npm ci
      - npm run e2e:ci

  - name: php-rest-api-test
    image: php:8.3-cli
    commands:
      - apt-get update && apt-get install -y unzip git libzip-dev && docker-php-ext-install zip
      - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
      - cd applications/php-rest-api
      - cp src/Inc/.env.example src/Inc/.env.dev
      - composer install --no-interaction --prefer-dist
      - composer audit --no-dev || true
      - composer test
      - composer analyse

  - name: php-mailer-api-test
    image: php:8.3-cli
    commands:
      - apt-get update && apt-get install -y unzip git libzip-dev && docker-php-ext-install zip
      - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
      - cd applications/php-mailer-api
      - cp src/Inc/.env.example src/Inc/.env.dev
      - composer install --no-interaction --prefer-dist
      - composer audit --no-dev || true
      - composer test
      - composer analyse

  - name: vue-admin-quality
    image: node:20
    commands:
      - cd applications/backend
      - npm ci
      - npm run quality:ci
      - npm audit --audit-level=high || true

  - name: python-api-smoke
    image: python:3.12-slim
    commands:
      - cd applications/python-rest-api/source_code
      - pip install --no-cache-dir -r requirements.txt -r requirements-dev.txt
      - pip install --no-cache-dir pip-audit
      - pip-audit -r requirements.txt || true
      - ruff check app.py configs module tests
      - python -m mypy configs module/helper
      - python -m pytest -q

  - name: vue-admin-e2e
    image: cypress/included:13.6.4
    commands:
      - cd applications/backend
      - npm ci
      - npm run test:e2e:ci

  - name: openapi-lint
    image: node:20
    commands:
      - npm ci
      - npm run openapi:lint

  - name: compose-config
    image: docker/compose:2.32.4
    commands:
      - docker compose -f docker-compose.yml config --quiet

  - name: secret-scan
    image: zricethezav/gitleaks:v8.21.2
    commands:
      - gitleaks detect --source . --redact --verbose
    when:
      event:
        - push
        - pull_request
