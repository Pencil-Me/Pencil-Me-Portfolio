    <!-- Favicon and Icons -->
    <link rel="icon" href="/favicon.ico" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="var(--pm-manifest-tile, #1a0408)" />
    <meta name="msapplication-TileColor" content="#1a0408" />
    <meta name="theme-color" content="#eeeeef" />

    <!-- Base URL -->
    <base href="/" />

    <!-- Kritische Tokens vor App-Bundle (sync mit sass/helpers/_variables.scss) -->
    <style id="pm-critical-tokens">
      :root,
      [data-bs-theme='light'] {
        --pm-red-shade-500: #922038;
        --pm-dark-shade-500: #0f1014;
        --pm-gold-shade-500: #c9a227;
        --pm-dark-shade-50: #f5f3f0;
        --pm-theme-color: #f5f3f0;
        --pm-loader-bg: #0f1014;
        --pm-loader-stroke: #6b1e32;
        --pm-manifest-tile: #1a0408;
      }

      [data-bs-theme='dark'] {
        --pm-theme-color: #0f1014;
        --pm-loader-stroke: #e0e4f0;
      }

      html,
      body {
        font-family:
          'IBM Plex Sans',
          system-ui,
          -apple-system,
          'Segoe UI',
          roboto,
          sans-serif;
      }
    </style>

    <script>
      (function () {
        var key = 'pm-theme';
        var stored = localStorage.getItem(key);
        var theme =
          stored === 'light' || stored === 'dark'
            ? stored
            : window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
        document.documentElement.setAttribute('data-bs-theme', theme);
        document.documentElement.style.colorScheme = theme;

        var themeColor = getComputedStyle(document.documentElement)
          .getPropertyValue('--pm-theme-color')
          .trim();
        var meta = document.querySelector('meta[name="theme-color"]');

        if (meta && themeColor) {
          meta.setAttribute('content', themeColor);
        }

        var tileColor = getComputedStyle(document.documentElement)
          .getPropertyValue('--pm-manifest-tile')
          .trim();
        var tileMeta = document.querySelector('meta[name="msapplication-TileColor"]');

        if (tileMeta && tileColor) {
          tileMeta.setAttribute('content', tileColor);
        }
      })();
    </script>

    <!-- Styles -->
    <style>
      body,
      html {
        height: 100%;
        display: block;
        margin: 0;
      }
      .loader {
        background: var(--pm-loader-bg);
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
      }
      .loader .spinner {
        height: 200px;
        width: 200px;
        animation: rotate 2s linear infinite;
        transform-origin: center center;
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        right: 0;
        margin: auto;
      }
      .loader .spinner .path {
        stroke-dasharray: 1, 200;
        stroke-dashoffset: 0;
        animation: dash 1.5s ease-in-out infinite;
        stroke-linecap: round;
        stroke: var(--pm-loader-stroke);
      }

      @keyframes rotate {
        100% {
          transform: rotate(360deg);
        }
      }
      @keyframes dash {
        0% {
          stroke-dasharray: 1, 200;
          stroke-dashoffset: 0;
        }
        50% {
          stroke-dasharray: 89, 200;
          stroke-dashoffset: -35px;
        }
        100% {
          stroke-dasharray: 89, 200;
          stroke-dashoffset: -124px;
        }
      }
    </style>

    <!-- Matomo (nach App-Load, blockiert Initial-Parsing nicht) -->
    <script>
      window.addEventListener(
        'load',
        function () {
          var _paq = (window._paq = window._paq || []);
          _paq.push(['trackPageView']);
          _paq.push(['enableLinkTracking']);
          var u = '//analytics.pencil-me.eu/';
          _paq.push(['setTrackerUrl', u + 'matomo.php']);
          _paq.push(['setSiteId', '2']);
          var d = document,
            g = d.createElement('script'),
            s = d.getElementsByTagName('script')[0];
          g.async = true;
          g.src = u + 'matomo.js';
          s.parentNode.insertBefore(g, s);
        },
        { once: true },
      );
    </script>
  </head>
  <body>
    <noscript>
      <strong>
        Ohne JavaScript funktioniert diese Seite leider nicht richtig. Bitte aktiviere JavaScript in
        deinem Browser.
      </strong>
    </noscript>

    <app-root>
      <div class="loader">
        <svg class="spinner" viewBox="25 25 50 50">
          <circle
            class="path"
            cx="50"
            cy="50"
            r="20"
            fill="none"
            stroke-width="2"
            stroke-miterlimit="10"
          />
        </svg>
      </div>
    </app-root>
  </body>
</html>
