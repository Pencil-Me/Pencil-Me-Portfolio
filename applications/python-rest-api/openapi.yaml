openapi: 3.0.3
info:
  title: Pencil Me Portfolio — Python Admin API
  description: |
    Admin-CRUD fuer die Vue-UI. Basis hinter Nginx: `/api`.
    Oeffentliche Reads und Kontakt-Mail laufen ueber PHP `/api2` — siehe ADR-001.
  version: 1.0.0
servers:
  - url: http://localhost:8080/api
    description: Docker / Nginx Gateway
components:
  securitySchemes:
    BackendKey:
      type: apiKey
      in: header
      name: API-Key
      description: be_key fuer Admin-CRUD
  schemas:
    ErrorMessage:
      type: object
      required: [message]
      properties:
        message:
          type: string
    UuidPath:
      type: string
      format: uuid
paths:
  /healthcheck:
    get:
      summary: Health-Check
      operationId: healthcheck
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
  /project:
    get:
      summary: Alle Projekte (Admin)
      operationId: listProjects
      security:
        - BackendKey: []
      responses:
        '200':
          description: Projektliste
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
    post:
      summary: Projekt anlegen
      operationId: createProject
      security:
        - BackendKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '201':
          description: Erstellt
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: CREATED_SUCCESSFULLY
  /project/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/UuidPath'
    get:
      summary: Einzelnes Projekt (Admin)
      operationId: getProject
      security:
        - BackendKey: []
      responses:
        '200':
          description: Projekt
        '404':
          description: Nicht gefunden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
    put:
      summary: Projekt aktualisieren
      operationId: updateProject
      security:
        - BackendKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Aktualisiert
    delete:
      summary: Projekt loeschen
      operationId: deleteProject
      security:
        - BackendKey: []
      responses:
        '200':
          description: Geloescht
  /customer:
    get:
      summary: Alle Kunden (Admin)
      operationId: listCustomers
      security:
        - BackendKey: []
      responses:
        '200':
          description: Kundenliste
    post:
      summary: Kunde anlegen
      operationId: createCustomer
      security:
        - BackendKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '201':
          description: Erstellt
  /customer/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/UuidPath'
    get:
      summary: Einzelner Kunde
      operationId: getCustomer
      security:
        - BackendKey: []
      responses:
        '200':
          description: Kunde
    put:
      summary: Kunde aktualisieren
      operationId: updateCustomer
      security:
        - BackendKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Aktualisiert
    delete:
      summary: Kunde loeschen
      operationId: deleteCustomer
      security:
        - BackendKey: []
      responses:
        '200':
          description: Geloescht
  /techstack:
    get:
      summary: Tech-Stack (Admin)
      operationId: listTechstack
      security:
        - BackendKey: []
      responses:
        '200':
          description: Liste
    post:
      summary: Tech-Stack-Eintrag anlegen
      operationId: createTechstack
      security:
        - BackendKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '201':
          description: Erstellt
  /techstack/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/UuidPath'
    get:
      summary: Einzelner Tech-Stack-Eintrag
      operationId: getTechstack
      security:
        - BackendKey: []
      responses:
        '200':
          description: Eintrag
    put:
      summary: Aktualisieren
      operationId: updateTechstack
      security:
        - BackendKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: OK
    delete:
      summary: Loeschen
      operationId: deleteTechstack
      security:
        - BackendKey: []
      responses:
        '200':
          description: OK
  /project_types:
    get:
      summary: Projekt-Typen Lookup
      operationId: listProjectTypes
      security:
        - BackendKey: []
      responses:
        '200':
          description: Typenliste
  /techstack_types:
    get:
      summary: Tech-Stack-Typen Lookup
      operationId: listTechstackTypes
      security:
        - BackendKey: []
      responses:
        '200':
          description: Typenliste
