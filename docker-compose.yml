x-python-env: &python-env
  APP_ENV: ${APP_ENV:-development}
  LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
  DB_HOST: ${DB_HOST:-pm-db}
  DB_PORT: ${DB_PORT:-3306}
  DB_USERNAME: ${DB_USERNAME:-user}
  DB_PASSWORD: ${DB_PASSWORD:-test}
  DB_DATABASE: ${DB_DATABASE:-portfolio_db}
  API_KEY_BE: ${API_KEY_BE:-secretApiBEkey}
  BASE_URL: ${BASE_URL:-}
  ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}

services:
  frontend:
    container_name: pm-frontend_angular
    build:
      context: ./applications/frontend
      dockerfile: ./Dockerfile
      args:
        BUILD_CONFIGURATION: docker
        API_KEY_FE: ${API_KEY_FE:-secretApiFEkey}

  backend:
    container_name: pm-backend_vue
    build:
      context: ./applications/backend
      dockerfile: ./Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080/api}
        VITE_API_KEY: ${VITE_API_KEY:-secretApiBEkey}

  nginx:
    container_name: pm-middlenginx
    image: nginx:stable-alpine
    depends_on:
      - frontend
      - backend
      - php_api
      - python_api
      - php_mailer
    expose:
      - "80"
    ports:
      - "8080:80"
    volumes:
      - ./nginx.middle.conf:/etc/nginx/conf.d/default.conf:ro

  python_api:
    container_name: pm-api_python
    build:
      context: ./applications/python-rest-api
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./applications/python-rest-api/source_code:/app
    environment:
      <<: *python-env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8181/healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  php_api:
    container_name: pm-api_php
    build:
      context: ./applications/php-rest-api
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3003:80"
    environment:
      APP_ENV: ${APP_ENV:-development}
    volumes:
      - ./applications/php-rest-api/public:/var/www/html/public
      - ./applications/php-rest-api/src/Inc/.env.dev:/var/www/html/src/Inc/.env.dev:ro
      - php_api_logs:/var/www/html/src/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1/healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  php_mailer:
    container_name: pm-mailer_php
    build:
      context: ./applications/php-mailer-api
      dockerfile: Dockerfile
    ports:
      - "3002:80"
    environment:
      APP_ENV: ${APP_ENV:-development}
    volumes:
      - ./applications/php-mailer-api/src:/var/www/html/src
      - ./applications/php-mailer-api/src/Inc/.env.dev:/var/www/html/src/Inc/.env.dev:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1/healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  db:
    container_name: pm-db
    ports:
      - "3306:3306"
    build:
      context: ./applications/db
      dockerfile: Dockerfile
    volumes:
      - data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "user", "-ptest"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  phpmyadmin:
    profiles:
      - dev
    depends_on:
      db:
        condition: service_healthy
    container_name: pm-phpmyadmin
    image: phpmyadmin/phpmyadmin
    ports:
      - "8000:80"
    environment:
      PMA_HOST: pm-db
      MYSQL_USER: ${DB_USERNAME:-user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-test}

volumes:
  data:
  php_api_logs:
