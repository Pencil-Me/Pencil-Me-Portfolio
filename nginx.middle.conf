#If you have more containers and you want to conect them,
#copy the server and update. Remember to open middlenginx's ports.

limit_req_zone $binary_remote_addr zone=contact_form:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=admin_api:10m rate=60r/m;

server {
  listen 80;

  # Docker-Embedded-DNS: Upstream-Hostnamen periodisch aufloesen (sonst stale IPs
  # nach `docker compose up --build`, wenn nginx laenger laeuft als andere Services).
  resolver 127.0.0.11 valid=30s ipv6=off;

  gzip on;
  gzip_vary on;
  gzip_min_length 256;
  gzip_types application/json application/javascript text/css text/plain;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location = /api2/send_email {
    limit_req zone=contact_form burst=5 nodelay;
    set $upstream_php_api "pm-api_php:80";
    rewrite ^/api2(.*) /index.php$1 break;
    proxy_pass http://$upstream_php_api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api2 {
    set $upstream_php_api "pm-api_php:80";
    rewrite ^/api2(.*) /index.php$1 break;
    proxy_pass http://$upstream_php_api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Mailer: nur Docker-intern (pm-api_php -> pm-mailer_php), kein Gateway-Pfad

  location /api {
    limit_req zone=admin_api burst=20 nodelay;
    # Bei Ueberlast liefert nginx 503 (Standard) statt 429 — bewusst so konfiguriert
    set $upstream_python_api "pm-api_python:8181";
    rewrite ^/api(.*) $1 break;
    proxy_pass http://$upstream_python_api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /backend {
    return 301 /backend/;
  }

  location /backend/ {
    set $upstream_backend "pm-backend_vue:80";
    proxy_pass http://$upstream_backend/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    set $upstream_frontend "pm-frontend_angular:80";
    proxy_pass http://$upstream_frontend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
